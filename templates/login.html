<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimulAi | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="background-orb orb-blue"></div>
    <div class="background-orb orb-purple"></div>
    <div class="background-grid"></div>

    <main class="login-page">
        <section class="login-card" aria-label="SimulAi login">
            <div class="brand">
                <div class="logo-wrap">
                    <img src="{{ url_for('static', filename='images/simulai-logo.png') }}"
                         alt="SimulAi logo"
                         class="brand-logo">
                </div>

                <div class="brand-name">Simul<span>Ai</span></div>
                <p class="brand-tagline">AI Virtual Interview Simulator</p>
            </div>

            <div class="welcome-section">
                <h1 id="welcome-title">Welcome</h1>
                <p>Sign in to continue your interview journey.</p>
            </div>

            <form id="login-form" method="POST" action="/login" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="8" r="3.5"></circle>
                                <path d="M5.5 19c.8-3 3.1-4.7 6.5-4.7s5.7 1.7 6.5 4.7"></path>
                            </svg>
                        </span>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            maxlength="50"
                            required>
                    </div>
                    <span class="field-error" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                                <path d="M8 10V7.5a4 4 0 0 1 8 0V10"></path>
                            </svg>
                        </span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>
                        <button type="button" class="password-toggle" id="password-toggle"
                                aria-label="Show password" title="Show password">
                            <svg id="eye-open" viewBox="0 0 24 24" fill="none">
                                <path d="M2.5 12s3.3-5 9.5-5 9.5 5 9.5 5-3.3 5-9.5 5-9.5-5-9.5-5Z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>
                            <svg id="eye-closed" viewBox="0 0 24 24" fill="none" class="hidden">
                                <path d="M3 3l18 18"></path>
                                <path d="M10.6 5.2A10.7 10.7 0 0 1 12 5c6.2 0 9.5 7 9.5 7a16 16 0 0 1-3.1 3.7"></path>
                                <path d="M6.1 6.2C3.7 7.8 2.5 12 2.5 12s3.3 5 9.5 5c1.4 0 2.7-.3 3.8-.8"></path>
                            </svg>
                        </button>
                    </div>
                    <span class="field-error" id="password-error"></span>
                </div>

                <div class="form-message" id="form-message" role="alert" aria-live="polite"></div>

                <div class="action-row">

                <button
                type="submit"
                class="btn btn-primary"
                id="login-button"
                name="action"
                value="login">

                <span class="button-text">Login</span>
                <span class="button-loader" aria-hidden="true"></span>

                </button>

                <button
                 type="submit"
                 class="btn btn-secondary"
                 id="register-button"
                 name="action"
                 value="register">
                Register
                </button>
            </div>
            </form>

            <p class="footer-text">Practice. Perform. Improve.</p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
